allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  sharp: false
catalogMode: prefer
minimumReleaseAge: 2880 # Security: Wait 2 days (2880 minutes) before installing newly released packages
overrides:
  sharp: ^0.35.5
  toml: ^5.0.1
  vite@*: "catalog:"
packages:
  - apps/*
  - packages/*
