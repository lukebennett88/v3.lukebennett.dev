  "@astrojs/react": ^7.1.9
  "@astrojs/rss": ^4.0.19
  "@astrojs/sitemap": ^3.7.6
  "@keystatic/astro": ^6.0.0
  "@keystatic/core": ^0.6.10
  "@manypkg/cli": ^0.25.1
  "@sindresorhus/slugify": ^4.0.1
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@unpic/react": ^1.0.2
  astro: ^7.4.13
  clsx: ^2.1.1
  react: ^19.3.1
  react-compiler-runtime: 19.0.0-beta-ebf51a3-20250411
